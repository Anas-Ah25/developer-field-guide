name: Check guide
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  state-and-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/*.test.cjs
      - run: node --check assets/app.js && node --check assets/model.js
      - run: python -m pip install -r requirements.txt
      - run: python build.py
      - run: git diff --exit-code -- assets/content.js advanced-reference.md
